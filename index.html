<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Recetario — Flor de Azalea</title>

<!-- PWA: permite "Agregar a inicio" en Android/iOS sin la barra del navegador -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recetario">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══ CONFIGURACIÓN INICIAL ══ -->
<div id="screen-setup">
  <div class="setup-card">
    <div class="setup-logo">
      <div class="icon">🍳</div>
      <h1>Recetario Flor de Azalea</h1>
      <p>Conecta con la hoja de recetas para empezar</p>
    </div>

    <div class="setup-field">
      <label for="setup-url">URL del Web App (Google Apps Script)</label>
      <input type="url" id="setup-url" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="setup-hint">La URL pública de tu deployment. Solo se pide una vez por dispositivo.</div>
    </div>

    <button class="btn-setup" id="btn-connect">Conectar y abrir recetario →</button>
    <div class="setup-error" id="setup-error"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <header class="kds-header">
    <button class="kds-mob-menu" id="btn-mob-menu" aria-label="Menú">☰</button>
    <div class="kds-header-logo"><div class="live-dot"></div>Recetario</div>
    <div class="header-spacer"></div>
    <span class="header-time" id="header-time">—</span>
    <button class="btn-icon" id="btn-configurar">⚙ Configurar</button>
  </header>

  <div id="kds-sidebar-overlay"></div>

  <div class="kds-body">
    <aside class="kds-sidebar" id="kds-sidebar">
      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="Buscar receta…">
      </div>
      <div class="sidebar-filters" id="type-filters"></div>
      <div class="recipe-list" id="recipe-list">
        <div class="sidebar-empty">Cargando…</div>
      </div>
    </aside>

    <main class="kds-main" id="kds-main">
      <div class="kds-empty">
        <div class="big-icon">🍽</div>
        <h2>Selecciona una receta</h2>
        <p>Elige del panel izquierdo. Verás los ingredientes a reunir y el paso a paso de la preparación.</p>
      </div>
    </main>
  </div>
</div>

<div class="loader-wrap hidden" id="loader">
  <div class="spinner"></div>
  <div class="loader-text" id="loader-text">Cargando…</div>
</div>

<div class="kds-toast" id="kds-toast"></div>

<script src="app.js"></script>
</body>
</html>
